<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2026 Draft Recap — North to South Fantasy Worldwide</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #0f1c2e;
    --field-deep: #0a1420;
    --chalk: #f2efe4;
    --chalk-dim: #a7b2c2;
    --red: #b3272d;
    --red-bright: #e0454b;
    --slate: #16273b;
    --line: #263a52;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--field);
    color: var(--chalk);
    font-family: 'Source Serif 4', Georgia, serif;
    line-height: 1.6;
  }

  a { color: inherit; }

  .marquee {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--field-deep);
    border-bottom: 2px solid var(--red);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--chalk-dim);
  }
  .marquee a.back { color: var(--chalk-dim); text-decoration: none; }
  .marquee a.back:hover { color: var(--chalk); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header.hero {
    padding: 56px 24px 40px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow-top {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--red);
    margin-bottom: 16px;
  }
  h1.title {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(32px, 6vw, 52px);
    line-height: 1;
    margin: 0;
  }
  .dek {
    margin-top: 16px;
    color: var(--chalk-dim);
    font-size: 15px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }

  .team {
    padding: 36px 0;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 20px;
  }
  .team:last-of-type { border-bottom: none; }

  .badge {
    text-align: center;
  }
  .num {
    font-family: 'Anton', sans-serif;
    font-size: 30px;
    color: var(--chalk-dim);
    line-height: 1;
  }
  .grade {
    display: inline-block;
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--slate);
    border: 1px solid var(--line);
    color: var(--red-bright);
  }

  .team h2 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: 22px;
    margin: 0 0 2px;
  }
  .team .handle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--chalk-dim);
    text-transform: lowercase;
    margin-bottom: 12px;
  }
  .team p {
    margin: 0 0 12px;
    color: var(--chalk-dim);
    font-size: 15.5px;
  }
  .team p:last-child { margin-bottom: 0; }

  footer {
    padding: 32px 24px 48px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--chalk-dim);
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .team { grid-template-columns: 1fr; }
    .badge { display: flex; align-items: center; gap: 10px; }
    .num { font-size: 20px; }
  }
</style>
</head>
<body>

  <div class="marquee">
    <a class="back" href="index.html">&larr; N/S FANTASY WORLDWIDE</a>
    <span>2026 DRAFT RECAP</span>
  </div>

  <header class="hero">
    <div class="eyebrow-top">17 ROUNDS · 10 TEAMS</div>
    <h1 class="title">2026 Draft Recap</h1>
